<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Casal Fit · Arthur & Talita</title>
  <meta name="description" content="Treino em casa de 6 semanas do casal Arthur e Talita: abdômen, perda de peso, dieta para diabetes e lembretes.">
  <meta name="theme-color" content="#0e1020">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Casal Fit">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topo">
    <div class="marca"><span class="logo">💑</span><b>Casal Fit</b></div>
    <div id="pessoas" class="pessoas"></div>
    <button id="btnInstalar" class="btn mini-btn" hidden>Instalar</button>
  </header>

  <main id="app"></main>

  <nav class="tabbar">
    <button data-aba="casal"><span>💑</span>Casal</button>
    <button data-aba="treino"><span>🏋️</span>Treino</button>
    <button data-aba="taf"><span>🎖️</span>TAF</button>
    <button data-aba="dieta"><span>🥗</span>Dieta</button>
    <button data-aba="diario"><span>📋</span>Diário</button>
    <button data-aba="perfil"><span>👤</span>Perfil</button>
  </nav>

  <div id="player" class="player" hidden></div>
  <div id="modal" class="modal" hidden></div>
  <div id="toast" class="toast"></div>

  <noscript>Ative o JavaScript para usar o Casal Fit.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
